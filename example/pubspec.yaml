name: magic_notifications_example
description: Boots a Magic app with the notifications provider and shows what works without a backend or a OneSignal account.
publish_to: 'none'

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  magic_notifications:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
