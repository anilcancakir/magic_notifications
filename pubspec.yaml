name: magic_notifications
description: Multi-channel notification system for Magic Framework. Supports database (in-app), push (OneSignal), and mail channels.
version: 0.4.0
homepage: https://magic.fluttersdk.com/notifications
documentation: https://magic.fluttersdk.com/packages/notifications/getting-started/installation
repository: https://github.com/fluttersdk/magic_notifications
issue_tracker: https://github.com/fluttersdk/magic_notifications/issues

topics:
  - notifications
  - push-notifications
  - onesignal
  - magic-framework
  - flutter-plugin

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 0.1.0 is the first core without the broadcasting layer, which now lives in
  # `magic_socket`.
  magic: ^0.1.0
  # Carries `Echo`, `BroadcastChannel` and `BroadcastEvent`, which the realtime
  # notification path subscribes through. ^0.0.1 resolves `>=0.0.1 <0.1.0`.
  magic_socket: ^0.0.1
  # 0.0.15 is the requirement: `XcodeProjectEditor.setEntitlementsPaths`,
  # which the iOS installer step calls to point Release at its own
  # entitlements file, does not exist below it. The floor names 0.0.21, the
  # newest release when the 2026-11 batch re-pinned every sibling.
  dowel: ^0.0.21
  # ^5.8.0 is a floor: the login/logout identity race was patched across
  # 5.5.3, 5.5.5, 5.6.2 and 5.6.6, and 5.8.0 is the newest release when the
  # 2026-11 batch re-pinned every sibling.
  onesignal_flutter: ^5.8.0
  # Direct rather than transitive-through-flutter, because this package now
  # names `@internal` in its own source: `NotificationViewRegistry` is exported
  # from the barrel, so `registerDefault` is reachable by a host that must not
  # call it, and the annotation is the only thing that can say so under Dart's
  # library-level privacy. `depend_on_referenced_packages` asks for the import
  # to be declared where it is used.
  meta: ^1.19.0
  # Direct rather than transitive: this package ships widgets, so wind is a
  # dependency of its own. The floor names 1.12.0, the first wind_kit release
  # on material_ui.
  wind_kit: ^1.12.0
  # `Icons` and `CircularProgressIndicator` come from material_ui now that
  # Flutter's own material library is deprecated. wind_kit 1.12.0 builds on the
  # same package, so the two share one set of material types.
  material_ui: ^1.11.0
  # Opens the app's own notification settings page for
  # `PushDriver.openPlatformSettings`, which OneSignal reaches only through its
  # untranslated fallback dialog. Held on 7.x on purpose: 8.0.0 dropped
  # CocoaPods on iOS and macOS, and an adopter who still builds with a Podfile
  # would fail to build on a patch release of this package. 7.0.0 ships both a
  # podspec and a Package.swift, the same channel contract, and the same pages
  # (the notification page on Android 8+ and iOS 15.4+).
  app_settings: ">=7.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0
  # Declared so the polling-interval test can elapse a timer instead of
  # sleeping. It already arrives transitively through flutter_test; naming it
  # here is what makes importing it legal.
  fake_async: ^1.3.3
