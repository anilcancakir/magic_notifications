name: magic_notifications
description: "Notifications for Magic apps: a backend-driven inbox with ready-made views, OneSignal push on mobile and web, and realtime delivery over your socket."
version: 1.0.0
homepage: https://anilcancakir.com/magic/notifications
repository: https://github.com/anilcancakir/magic_notifications
issue_tracker: https://github.com/anilcancakir/magic_notifications/issues

topics:
  - notifications
  - push-notifications
  - onesignal
  - magic-framework
  - flutter-plugin

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 1.0.0 is the first stable core, and it ships without the broadcasting layer,
  # which lives in `magic_socket`.
  magic: ^1.0.0
  # Carries `Echo`, `BroadcastChannel` and `BroadcastEvent`, which the realtime
  # notification path subscribes through.
  magic_socket: ^1.0.0
  # `XcodeProjectEditor.setEntitlementsPaths`, which the iOS installer step
  # calls to point Release at its own entitlements file, ships in dowel 1.0.0.
  dowel: ^1.0.0
  # ^5.8.0 is a floor: the login/logout identity race was patched across
  # 5.5.3, 5.5.5, 5.6.2 and 5.6.6, and 5.8.0 is the newest release when the
  # 2026-11 batch re-pinned every sibling.
  onesignal_flutter: ^5.8.0
  # Direct rather than transitive-through-flutter, because this package now
  # names `@internal` in its own source: `NotificationViewRegistry` is exported
  # from the barrel, so `registerDefault` is reachable by a host that must not
  # call it, and the annotation is the only thing that can say so under Dart's
  # library-level privacy. `depend_on_referenced_packages` asks for the import
  # to be declared where it is used.
  meta: ^1.19.0
  # Direct rather than transitive: this package ships widgets, so wind is a
  # dependency of its own. The floor names 1.12.0, the first wind_kit release
  # on material_ui.
  wind_kit: ^1.12.0
  # `Icons` and `CircularProgressIndicator` come from material_ui now that
  # Flutter's own material library is deprecated. wind_kit 1.12.0 builds on the
  # same package, so the two share one set of material types.
  material_ui: ^1.11.0
  # Opens the app's own notification settings page for
  # `PushDriver.openPlatformSettings`, which OneSignal reaches only through its
  # untranslated fallback dialog. The range reaches back to 7.0.0 on purpose:
  # 8.0.0 dropped CocoaPods on iOS and macOS, and 7.x ships both a podspec and a
  # Package.swift, so an adopter who still builds with a Podfile can pin
  # `app_settings: ^7.0.0` in the app without an override. Pub selects the
  # newest version in the range, so an app with no other constraint gets 9.x.
  # The one call,
  # `AppSettings.openAppSettings(type: AppSettingsType.notification)`, is the
  # same across the range (the notification page on Android 8+ and iOS 15.4+).
  app_settings: ">=7.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0
  # Declared so the polling-interval test can elapse a timer instead of
  # sleeping. It already arrives transitively through flutter_test; naming it
  # here is what makes importing it legal.
  fake_async: ^1.3.3
